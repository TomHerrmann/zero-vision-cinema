# Dependabot version updates. Security alerts and security-fix PRs are turned
# on separately in repo Settings > Code security (Dependabot alerts and
# Dependabot security updates).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    ignore:
      # Payload 3 declares graphql ^16 as a peer (payload, @payloadcms/next,
      # @payloadcms/graphql), so a graphql 17 bump fails npm install with
      # ERESOLVE. Drop this once Payload supports graphql 17.
      - dependency-name: graphql
        update-types: ["version-update:semver-major"]
    groups:
      # react-stripe-js pins a stripe-js major as a peer, so bumping either
      # alone fails npm install. Keep them in one PR. Listed first because a
      # package joins the first group it matches.
      stripe-js:
        patterns: ["@stripe/stripe-js", "@stripe/react-stripe-js"]
      # One PR for all patch and minor bumps; majors still come one at a time.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
